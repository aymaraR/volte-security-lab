networks:
  volte-net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.20.0.0/24

services:

  mongodb:
    image: mongo:4.4
    container_name: mongodb
    networks:
      volte-net:
        ipv4_address: 172.20.0.2
    volumes:
      - mongodb_data:/data/db

  open5gs:
    image: open5gs-local:latest
    container_name: open5gs
    privileged: true
    cap_add:
      - NET_ADMIN
    sysctls:
      - net.ipv4.ip_forward=1
    networks:
      volte-net:
        ipv4_address: 172.20.0.3
    environment:
      - DB_URI=mongodb://172.20.0.2/open5gs
    depends_on:
      - mongodb
    ports:
      - "3000:3000"
    command: >
      bash -c "
        open5gs-nrfd &
        sleep 2 &&
        open5gs-mmed &
        open5gs-sgwcd &
        open5gs-sgwud &
        open5gs-smfd &
        open5gs-amfd &
        open5gs-hssd &
        open5gs-pcrfd &
        open5gs-upfd &
        wait
      "

  kamailio:
    image: kamailio-ims:latest
    container_name: kamailio
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      volte-net:
        ipv4_address: 172.20.0.6
    ports:
      - "5060:5060/udp"
      - "5060:5060/tcp"
    command: bash -c "sleep infinity"

  asterisk:
    image: asterisk-ims:latest
    container_name: asterisk
    privileged: true
    networks:
      volte-net:
        ipv4_address: 172.20.0.7
    ports:
      - "5061:5061/udp"
      - "10000-10100:10000-10100/udp"
    command: bash -c "sleep infinity"

  enb:
    image: srsran-zmq:latest
    container_name: srsenb
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      volte-net:
        ipv4_address: 172.20.0.4
    depends_on:
      - open5gs
    command: bash -c "sleep infinity"

  ue:
    image: srsran-zmq:latest
    container_name: srsue
    privileged: true
    cap_add:
      - NET_ADMIN
    networks:
      volte-net:
        ipv4_address: 172.20.0.5
    depends_on:
      - enb
    command: bash -c "sleep infinity"

volumes:
  mongodb_data:
