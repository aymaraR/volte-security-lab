#!KAMAILIO

####### Global Parameters #########

mpath="/usr/local/lib64/kamailio/modules/"

log_facility=LOG_LOCAL0
log_prefix="{$mt $hdr(CSeq) $ci} "
children=4

port=6060
listen=udp:172.20.0.6:6060
listen=tcp:172.20.0.6:6060

####### Modules Section ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "cdp.so"
loadmodule "cdp_avp.so"
loadmodule "ims_dialog.so"

modparam("ims_dialog", "dlg_flag", 1)

modparam("ims_dialog", "dlg_flag", 1)
loadmodule "presence.so"
loadmodule "ims_usrloc_scscf.so"
loadmodule "ims_registrar_scscf.so"
loadmodule "ims_charging.so"

####### Module Parameters ########

# cdp — Diameter peer (hacia HSS via Cx)
modparam("cdp", "config_file", "/usr/local/etc/kamailio/scscf_diameter.xml")

# usrloc
modparam("ims_usrloc_scscf", "db_mode", 0)

# registrar
modparam("ims_registrar_scscf", "scscf_name", "sip:scscf.ims.mnc070.mcc999.3gppnetwork.org:6060")

# tm
modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

####### Routing Logic ########

request_route {
    # sanity checks
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("Malformed SIP request from $si:$sp\n");
        exit;
    }

    # handle REGISTER
    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # handle CANCEL / re-transmissions
    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    # loose route para re-invites / mid-dialog
    if (loose_route()) {
        route(RELAY);
        exit;
    }

    # por ahora, todo lo que no es REGISTER se reenvía
    route(RELAY);
}

route[REGISTER] {
    xlog("L_INFO", "S-CSCF: REGISTER from $fu\n");
    save("REG_SAR_REPLY", "location");
    exit;
}

route[REG_SAR_REPLY] {
    xlog("L_INFO", "S-CSCF: SAR reply return code [$avp(s:saa_return_code)]\n");
    switch ($avp(s:saa_return_code)) {
        case 1:
            xlog("L_INFO", "S-CSCF: SAR success - 200 OK ya enviado por el modulo\n");
            break;
        case -1:
            xlog("L_ERR", "S-CSCF: SAR failure\n");
            break;
        case -2:
            xlog("L_ERR", "S-CSCF: SAR error\n");
            break;
        default:
            xlog("L_ERR", "S-CSCF: codigo de retorno SAR desconocido\n");
            break;
    }
    exit;
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
