[general]
static=yes
writeprotect=no

[from-ims]
; Llamada entrante desde IMS — enrutar al destino
exten => _+!,1,NoOp(Llamada VoLTE entrante a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@scscf)
 same => n,Hangup()

exten => _X!,1,NoOp(Llamada VoLTE entrante a ${EXTEN})
 same => n,Dial(PJSIP/${EXTEN}@scscf)
 same => n,Hangup()

; Echo test — para verificar audio (marcar 1000)
exten => 1000,1,NoOp(Echo test)
 same => n,Answer()
 same => n,Echo()
 same => n,Hangup()
