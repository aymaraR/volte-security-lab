; Asterisk PJSIP - configuracion TAS para laboratorio VoLTE
; Se registra en el S-CSCF de Kamailio como un endpoint IMS

[global]
type=global
user_agent=Asterisk-VoLTE-TAS

; --- Transport UDP ---
[transport-udp]
type=transport
protocol=udp
bind=0.0.0.0:5061

; --- Registro de Asterisk en el S-CSCF ---
[scscf-reg]
type=registration
transport=transport-udp
outbound_auth=scscf-auth
server_uri=sip:172.20.0.6:6060
client_uri=sip:1000@ims.mnc070.mcc999.3gppnetwork.org
retry_interval=60
expiration=3600

[scscf-auth]
type=auth
auth_type=userpass
username=999070000000001
password=asterisk123

; --- Endpoint hacia el S-CSCF ---
[scscf]
type=endpoint
transport=transport-udp
context=from-ims
disallow=all
allow=ulaw
allow=alaw
allow=opus
outbound_auth=scscf-auth
aors=scscf

[scscf]
type=aor
contact=sip:172.20.0.6:6060
qualify_frequency=60

; --- Endpoint generico para UEs entrantes ---
[ue-endpoint]
type=endpoint
transport=transport-udp
context=from-ims
disallow=all
allow=ulaw
allow=alaw
allow=opus
direct_media=no

