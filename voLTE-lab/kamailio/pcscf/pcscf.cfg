#!KAMAILIO

####### Global Parameters #########

mpath="/usr/local/lib64/kamailio/modules/"

log_facility=LOG_LOCAL0
children=4

# Necesario en Kamailio 5.8+: habilitar el motor TLS.
enable_tls=1

port=4060
listen=udp:172.20.0.6:4060
listen=tcp:172.20.0.6:4060
# Gm seguro: el UE se registra por TLS (V1). El UDP 4060 se mantiene para
# las pruebas de laboratorio V3/V7 (en producción se cerraría).
listen=tls:172.20.0.6:5061

####### Modules Section ########

loadmodule "tm.so"
loadmodule "tmx.so"
loadmodule "sl.so"
loadmodule "rr.so"
loadmodule "pv.so"
loadmodule "maxfwd.so"
loadmodule "textops.so"
loadmodule "siputils.so"
loadmodule "xlog.so"
loadmodule "sanity.so"
loadmodule "ctl.so"
loadmodule "cfg_rpc.so"
loadmodule "ims_usrloc_pcscf.so"
loadmodule "ims_ipsec_pcscf.so"
loadmodule "ims_registrar_pcscf.so"
# Contramedida V1: TLS en la interfaz Gm.
loadmodule "tls.so"
# Contramedida V3/V7: binding identidad IMS <-> IP de origen registrada.
loadmodule "htable.so"

####### Module Parameters ########

modparam("tm", "failure_reply_mode", 3)
modparam("tm", "fr_timer", 30000)
modparam("tm", "fr_inv_timer", 120000)

modparam("ims_usrloc_pcscf", "db_mode", 0)

modparam("ims_registrar_pcscf", "pcscf_uri", "sip:172.20.0.6:4060")

# TLS: en Kamailio 5.8+ los parámetros (método, certificado, claves) van en
# /etc/kamailio/tls.cfg (perfil [server:default]).
modparam("tls", "config", "/etc/kamailio/tls.cfg")

# htable: IMPU -> IP desde la que se registró (se llena con el 200 OK).
modparam("htable", "htable", "idmap=>size=8;autoexpire=7200;")

####### Routing Logic ########

request_route {
    if (!mf_process_maxfwd_header(10)) {
        sl_send_reply("483", "Too Many Hops");
        exit;
    }

    if (!sanity_check("1511", "7")) {
        xlog("Malformed SIP request from $si:$sp\n");
        exit;
    }

    if (is_method("REGISTER")) {
        route(REGISTER);
        exit;
    }

    # --- V3/V7: solo el origen registrado puede usar una identidad IMS. ---
    # Los nodos internos (.6 CSCF, .7 Asterisk/TAS) están fuera del filtro Gm.
    if ($si != "172.20.0.7" && $si != "172.20.0.6") {
        if ($sht(idmap=>$fU) == $null) {
            xlog("L_ALERT", "P-CSCF: identidad desconocida '$fU' desde $si -> 403\n");
            sl_send_reply("403", "Unknown Identity");
            exit;
        }
        if ($sht(idmap=>$fU) != $si) {
            xlog("L_ALERT", "P-CSCF: '$fU' desde $si != origen registrado $sht(idmap=>$fU) -> 403\n");
            sl_send_reply("403", "Identity Origin Mismatch");
            exit;
        }
    }

    if (is_method("CANCEL")) {
        if (t_check_trans()) t_relay();
        exit;
    }

    if (!is_method("ACK")) {
        if (t_precheck_trans()) {
            t_check_trans();
            exit;
        }
        t_check_trans();
    }

    if (loose_route()) {
        route(RELAY);
        exit;
    }

    # peticiones iniciales que no son REGISTER (p.ej. INVITE):
    # el P-CSCF debe reenviarlas hacia el S-CSCF; si no, t_relay()
    # intenta resolver por DNS el dominio IMS del Request-URI
    # (que no existe) y falla con 478 Unresolvable destination.
    if (!has_totag()) {
        xlog("L_INFO", "P-CSCF: peticion inicial $rm from $fu -> forwarding to S-CSCF\n");
        $du = "sip:172.20.0.6:6060";
    }

    route(RELAY);
}


route[REGISTER] {
    xlog("L_INFO", "P-CSCF: REGISTER from $fu — forwarding to I-CSCF\n");
    # Guardar identidad y origen; el mapeo se confirma solo con 2xx.
    $avp(reg_impu) = $fU;
    $avp(reg_src) = $si;
    t_on_reply("REG_REPLY");
    # reenviar al I-CSCF
    $du = "sip:172.20.0.6:5060";
    route(RELAY);
}

onreply_route[REG_REPLY] {
    if (t_check_status("2[0-9][0-9]")) {
        if ($avp(reg_impu) != $null && $avp(reg_src) != $null) {
            $sht(idmap=>$avp(reg_impu)) = $avp(reg_src);
            xlog("L_INFO", "P-CSCF: idmap $avp(reg_impu) -> $avp(reg_src) (registro 2xx)\n");
        }
    }
}

route[RELAY] {
    if (!t_relay()) {
        sl_reply_error();
    }
    exit;
}
