# tls.cfg — Kamailio 5.8+ (perfil por dominio).
# Para el lab: TLSv1.2+ y sin exigir certificado de cliente (Gm).

[server:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
private_key = /etc/kamailio/tls/tls.key
certificate = /etc/kamailio/tls/tls.crt

[client:default]
method = TLSv1.2+
verify_certificate = no
require_certificate = no
